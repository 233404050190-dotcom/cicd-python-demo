name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Python Code Quality"]
    types:
      - completed
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server & Healthcheck
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Production Image
        run: |
          docker build -t cicd-python-demo:latest .

      - name: Deploy Container bằng Docker Compose
        run: |
          DOCKER_IMAGE=cicd-python-demo:latest docker compose -f docker-compose.prod.yml up -d

      - name: Chạy Script Health Check & Rollback
        run: |
          chmod +x scripts/healthcheck_rollback.sh
          ./scripts/healthcheck_rollback.sh
