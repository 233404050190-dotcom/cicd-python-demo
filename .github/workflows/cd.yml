name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Server & Healthcheck
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout the exact commit tested by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Production Image
        run: |
          docker build -t cicd-python-demo:latest .

      - name: Deploy Container bằng Docker Compose
        run: |
          DOCKER_IMAGE=cicd-python-demo:latest docker compose -f docker-compose.prod.yml up -d

      - name: Chạy Script Health Check & Rollback
        run: |
          chmod +x scripts/healthcheck_rollback.sh
          ./scripts/healthcheck_rollback.sh
