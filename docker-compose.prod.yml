services:
  web:
    image: ${DOCKER_IMAGE:-cicd-python-demo:latest}
    container_name: python_app_prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - envs/.env.prod
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
